# ============================================================================
# ABACUSflow 集群配置
# ============================================================================
#
# 本文件是 ABACUSflow 唯一的集群相关配置文件，不含任何硬编码路径。
# 换集群时通常只需修改 [ENV] [ABACUS] [MODULE] [SCHEDULER] 四节。
#
# 配置文件查找顺序（优先级从高到低）：
#   1. 环境变量 ABACUSFLOW_CONFIG 指定的文件
#   2. 环境变量 ABACUSFLOW_CONFIG_DIR 指定的配置目录
#   3. 从当前目录向上逐级查找的 condor.ini / config/condor.ini
#   4. 环境变量 ABACUSFLOW_HOME 下的 config/condor.ini
#   5. 程序自带的 config/condor.ini（本文件）
#
# 每一项都可以用环境变量临时覆盖（不必改文件）：
#   任意项 -> ABACUSFLOW_<大写键名>，例如：
#     export ABACUSFLOW_ABACUS_DIR=/opt/abacus/bin
#     export ABACUSFLOW_PSEUDO_POTENTIAL_DIR=/data/pp/sg15oncv
#     export ABACUSFLOW_SCHEDULER=slurm
#
# 容器 / Apptainer(SIF) 中使用时，可以把这些路径设成镜像内路径或挂载点。
# ============================================================================


# ============================================================================
# 环境初始化
# ============================================================================
[ENV]
# 生成脚本中调用 Python 的命令。留空则使用“运行 abacusflow 时所用的解释器”，
# 这在容器/SIF 里会自动指向镜像内的 python，最省事。
PYTHON =

# 可选：自定义环境初始化片段，原样插入生成脚本。适合 module/conda/spack 之外
# 的场景（如 source 某个 env 文件）。用 \n 表示换行。
# SETUP = source /etc/profile.d/hpc.sh

# 可选：Conda。CONDA_PATH 留空表示不使用 conda（脚本不会 source conda.sh）
CONDA_PATH =
CONDA_ENV =

# 可选：指定 abacus.py 的绝对路径（默认使用本程序所在目录的 abacus.py）
# ABACUS_PY =


# ============================================================================
# ABACUS 程序与数据
# ============================================================================
[ABACUS]
# 二选一：
#   1) ABACUS_BIN 直接给可执行文件完整路径（推荐，最不容易出错）
#   2) ABACUS_DIR + ABACUS_EXE
# 在 SIF 镜像中通常就是 abacus（容器内已在 PATH），可设为 ABACUS_BIN = abacus
# 默认取 PATH 中的 abacus（容器/SIF 内即镜像自带版本）；其他集群可改为完整路径
ABACUS_BIN = abacus
ABACUS_DIR =
ABACUS_EXE = abacus

# 赝势与轨道基组目录（必填，用于生成 INPUT/STRU 中的 pseudo_dir / orbital_dir）
# 生成输入文件时必须是当前机器上真实存在的目录。
PSEUDO_POTENTIAL_DIR =
ORBITAL_DIR =


# ============================================================================
# 结构文件
# ============================================================================
[STRU]
# 输入结构文件匹配模式（空格分隔多个），如 *.mcif *.vasp *.poscar *.cif
SUFFIX = *.vasp *.poscar *.cif *.mcif


# ============================================================================
# 环境模块（Environment Modules / Lmod）
# ============================================================================
[MODULE]
# 需要加载的模块（空格分隔）。留空则不加载、也不会生成任何 module 相关语句。
MODULES =

# 可选：加载前需要的初始化命令（例如 module 命令尚未初始化、或 Lmod 需先 source）
# 支持 \n 表示多行，例如：
# MODULE_SETUP = source /etc/profile.d/modules.sh
MODULE_SETUP =


# ============================================================================
# 作业调度器
# ============================================================================
[SCHEDULER]
# 调度器类型：slurm（默认）或 yh（天河系）
TYPE = slurm

# 作业提交命令。留空按 TYPE 推断：slurm -> sbatch，yh -> yhbatch
SUBMIT_CMD =

# 运行 MPI 任务的命令模板，可用占位符：{nodes} {cores} {partition} {cmd}
# 留空按 TYPE 推断：
#   slurm -> srun -N {nodes} -n {cores} -p {partition} {cmd}
#   yh    -> yhrun -N {nodes} -n {cores} -p {partition} {cmd}
# 其他示例：
#   RUN_CMD = mpirun -np {cores} {cmd}
#   RUN_CMD = srun --mpi=pmi2 -N {nodes} -n {cores} {cmd}
#   RUN_CMD = apptainer exec --cleanenv --bind $PWD:/data --pwd /data $SIF {cmd}
RUN_CMD =

# 队列查询命令（用于自动提交的资源监控）。留空默认 squeue
QUEUE_CMD =


# ============================================================================
# 分区与资源限制
# ============================================================================
[ALLOW]
# 分区名。可附加参数，如：normal --reservation=hpc_test
# 留空则不向调度器传 -p；按 RUN_CMD 中含 {partition} 与否自动处理。
PARTITION =

# 默认节点数
NODES = 1

# 每节点核心数
CORES_PER_NODE = 64

# 自动提交：总节点数上限 / 队列中最大作业数
TOTAL_NODE = 100
MAX_JOBS = 100

# 自动提交：提交间隔（秒）/ 队列检查间隔（秒）/ 配置热重载间隔（秒）
INTERVAL_TIME = 0.5
CHECK_TIME = 30
CONFIG_RELOAD_INTERVAL = 60
